# ============================================================
# bgen: конфигурация проекта книги
# Все пути — относительно корня проекта (директории с этим файлом).
# ============================================================

# ------------------------------------------------------------
# Вывод
# ------------------------------------------------------------
# Директория для результатов сборки. Создаётся автоматически.
# Может быть относительной (от корня проекта) или абсолютной.
# Примеры: "output", "../books", "/home/user/books".
output_dir: output

# ------------------------------------------------------------
# Метаданные для Pandoc
# Обязательны: title, author. lang по умолчанию "ru".
# ------------------------------------------------------------
metadata:
  title: "Пример книги"
  author:
    - "Иван Примеров"
  lang: ru
  # Обложка: путь относительно корня проекта.
  # Если файла нет — сборка продолжится без обложки (с предупреждением).
  cover-image: img/cover.jpg
  toc: true

# ------------------------------------------------------------
# Форматы сборки
# Секция с enabled: true = формат собирается.
# bgen.py build собирает все включённые форматы.
# bgen.py build --only fb2 переопределяет список.
# ------------------------------------------------------------

fb2:
  enabled: true
  output_name: book.fb2

  # Жанры FB2 (коды). Если не заданы — будет "unrecognised".
  genres:
    - sf
    - sf_fantasy

  # Дата документа в формате ISO (YYYY-MM-DD).
  # Если пусто или отсутствует — ставится текущая дата.
  date: ""

  # id книги.
  #   "" (пусто) — сгенерировать UUID5 от title+author+lang (стабильно, уникально).
  #   "любая строка" — использовать как есть.
  id: ""

  # Режим работы с <description>:
  #   auto     — bgen генерирует description из config.yaml/body/ и упорядочивает.
  #   template — fb2_description.xml задаёт структуру; bgen заполняет
  #              СУЩЕСТВУЮЩИЕ элементы шаблона значениями из config.yaml/body/.
  #              Новые элементы не добавляются, порядок не меняется.
  #   override — fb2_description.xml заменяет description целиком.
  #              Маргинальный режим: значения config.yaml для description
  #              (author, book-title, genre, date, annotation, coverpage, lang)
  #              игнорируются. config.yaml всё равно должен содержать
  #              title/author для Pandoc, иначе сборка упадёт.
  description: auto

  # Иерархическое форматирование XML с отступами (косметика).
  # Требует Python 3.9+ (ET.indent).
  pretty_print: true

