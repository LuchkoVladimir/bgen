# ============================================================
# bgen: конфигурация проекта книги
# Все пути — относительно корня проекта (директории с этим файлом).
# ============================================================

# ------------------------------------------------------------
# Вывод
# ------------------------------------------------------------
# Директория для результатов сборки. Создаётся автоматически.
# Может быть относительной (от корня проекта) или абсолютной.
# Примеры: "output", "../books", "/home/user/books".
output-dir: output

# Имя собранных файлов - <output-file-base>.<format_ext>
output-file-base: book

# ------------------------------------------------------------
# Типографика
# ------------------------------------------------------------
# Путь к typography.txt
# Если пусто — используется bgen/schemas/typography.txt (дефолтный).
typography-file: ""

# ------------------------------------------------------------
# Отладка (для всех вызовов Pandoc в сессии)
# ------------------------------------------------------------
# Диагностика парсера Pandoc (--trace, stderr; для разработчиков).
trace: false 
# Подробный вывод Pandoc (--verbose, stderr).
verbose: false
# Сохранять временные metadata.yaml в output-dir
# (<format>_metadata.yaml, <format>_addon_metadata.yaml для EPUB).
keep-metadata: false

# ------------------------------------------------------------
# Метаданные для Pandoc
# Обязательны: title, author. lang по умолчанию "ru".
# ------------------------------------------------------------
metadata:
  title: "Пример книги"
  author:
    - "Иван Примеров"
    - "Пётр Наподхватов"
  lang: ru
  # Обложка: путь относительно корня проекта.
  # Если файла нет — сборка продолжится без обложки (с предупреждением).
  cover-image: img/cover.jpg

# ------------------------------------------------------------
# Форматы сборки
# Секция с enabled: true = формат собирается.
# bgen.py build собирает все включённые форматы.
# bgen.py build --only fb2,epub переопределяет список.
# ------------------------------------------------------------

fb2:
  # включение сборки
  enabled: true

  # Режим вывода XML (структура + --wrap):
  #   pretty  — indent 2, --wrap auto (читаемо; дефолт).
  #   toleft  — indent "", --wrap auto (без пробелов, но с \n).
  #   src     — indent "", --wrap preserve (как в исходнике).
  print-mode: pretty

  # Сжимать ли итоговый FB2, например book.fb2 в book.fb2.zip (рядом с book.fb2).
  zip: true

  # Режим работы с <description-mode>:
  #   auto     — bgen генерирует description из config.yaml/body/ и упорядочивает.
  #   template — <fb2_description.xml> задаёт структуру и значения по умолчанию; bgen заполняет
  #              СУЩЕСТВУЮЩИЕ элементы шаблона значениями из config.yaml/body/.
  #              Новые элементы не добавляются, порядок не меняется.
  #   override — <fb2_description.xml> заменяет description целиком.
  #              Маргинальный режим: значения config.yaml для description
  #              (author, book-title, genre, date, annotation, coverpage, lang)
  #              игнорируются. config.yaml всё равно должен содержать
  #              metadata: title/author для Pandoc, иначе сборка упадёт.
  description-mode: auto

  # Путь к xml-файлу, например fb2_description.xml
  # Обязателен, если description-mode = template или override.
  # Если файл не найден — сборка прерывается (BgenError).
  # Fallback на bgen/ НЕ используется (описание книги — своё для каждого проекта).
  description-file: ""

  # Далее часть параметров <description>/ {<document-info>/<title-info>} можно переопределить
  # из конфигурации - помечены [cfg]. Другие можно задать через description-file [xml] или
  # генерятся bgen/pandoc [bgen]/[pandoc]
  # (<.>) - вложенная стурктура
  # (str) - строка
  # x-y   - количество элементов от x до y

  ##########################
  # description/title-info #
  ##########################

  # Жанры FB2 (коды). Если не заданы — будет "unrecognised".
  # name  - обязательный параметр
  # match - опциональный: 0 или отсутствует - не указываем в теге
  # genre         1-n (<.>) -- [cfg]
  genres:
    - name: sf
    - name: detective
      match: 20

  # Авторы (title-info/author). Может быть несколько.
  # Если пусто — используется то, что сгенерировал Pandoc из metadata:author.
  # Каждый элемент — словарь (все поля опциональны, но нужно nickname+ или (first-name+last-name)+):
  #     id         — id автора
  #     first-name, middle-name, last-name, nickname, home-page (список), email (список)
  # author        1-n (<.>) -- [cfg]
  title-author:
    # Пример: полный словарь
    - first-name: "Иван"
      middle-name: "Петрович"
      last-name: "Примеров"
      nickname: "ivan"
      home-page:
        - "https://example.com"
        - "https://ivan.example.com"
      email:
        - "ivan@example.com"
        - "i.prim@example.org"
      id: "author1"

  # book-title    1   (str) -- [pandoc] из metadata:title
  # annotation    0-1 (md)  -- [bgen-post] вставляется из md
  # Эти элементы могут содержать lang. И им стоит его содержать,
  # если lang отличается от общего title-info/lang.
  # Если пусто - не выставлять lang в соответствующий тег.
  book-title-lang: ""

  # Ключевые слова для поиска (FB2 title-info/keywords).
  # Список строк; при записи склеиваются через запятую.
  # keywords      0-1 (str) -- [cfg]
  keywords:
    - мысли
    - мечты
    - о жизни

  # Дата произведения (title-info/date).
  #   value - опционален.
  #   text  - опционален.
  #   lang  - опционален. Язык текстовой части.
  #   {value: "2026-11-05", text: "5 ноября 2026"} — value в ISO ("2026-11-05"), текст для отображения.
  # date          0-1 (<.>) -- [cfg]
  title-date:
    value: "2026-11-05"
    text: "5 ноября 2026"
    lang: ru

  # coverpage     0-1 (img) -- [pandoc] из metadata:cover-image
  # lang          1   (str) -- [pandoc] из metadata:lang
  # src-lang      0-1 (str) -- [xml]
  # translator    0-n (<.>) -- [xml]

  # Серия книг (title-info/sequence). Может быть несколько.
  # Каждый элемент — словарь {name, number, lang}.
  #   name   (обязателен) — название серии.
  #   number (опционален) — номер книги в серии.
  #   lang   (опционален) — язык серии (xml:lang), например "ru".
  sequence:
    - name: "Примерная серия"
      number: 1
      lang: ru


  #############################
  # description/document-info #
  #############################

  # author        1-n (<.>) -- [xml/cfg]/bgen-copy from title-info/author
  #                             (first-name, middle-name, last-name, nickname, home-page, email, id)
  # Копировать первого автора из title-info в document-info.
  # true  — bgen копирует первого автора.
  # false — не копирует; автора для document-info можно задать в xml или config
  doc-author-copy-first-from-title: true
  # Авторов можно задать и напрямую. Но если включен doc-author-copy-first-from-title,
  # то авторы перезаписываются первым из title-author.
  # doc-author - описвние параметра идентично title-author
  doc-author:
    # минимальное заполнение
    - nickname: "boris"

  # program-used  0-1 (str) -- [bgen] перезаписывается на своё.

  # Дата документа (дата файла, не произведения — для произведения title-date).
  #   value - опционален.
  #   text  - опционален.
  #   lang  - опционален. Язык текстовой части.
  #   {value: "2026-11-18", text: "18 ноября 2026"} — value в ISO ("2026-11-18"), текст для отображения.
  # date          0-1 (<.>) -- [cfg]
  doc-date:
    value: "2026-11-18"
    text: "18 ноября 2026"

  # src-url       0-n (str) -- [xml] Откуда взят оригинальный документ, доступный в online
  # src-ocr       0-1 (str) -- [xml] Автор OCR или оригинального документа, размещенного в online. (откуда сканили)

  # id книги.
  #   "" (пусто) — сгенерировать UUID5 от title+author+lang (стабильно, уникально).
  #   "любая строка" — использовать как указано.
  # id            1   (str) -- [cfg]
  id: ""

  # Версия FB2-документа (document-info/version).
  # Пусто — "1.0". Иначе — указанное значение как есть.
  # Увеличивайте при публичном изменении книги (см. спецификацию FB2).
  # version       1   (str) -- [cfg]
  version: ""

  # history       0-1 (md-str) -- [xml] История изменений документа
  # publisher     0-n (<.>) -- [xml] Правообладатель как у автора теги


# ------------------------------------------------------------
# EPUB
# ------------------------------------------------------------
epub:
  # включение сборки
  enabled: true
  # Путь к CSS
  # Если пусто — используется bgen/schemas/epub.css (дефолтный).
  css-file: ""
  # Включить видимую страницу с оглавлением в начале книги
  # (Pandoc --toc: nav.xhtml добавляется в spine с linear="yes").
  # false — обычно для художественной прозы.
  # true — для нефикшна, сборников рассказов, книг со сложной структурой.
  toc: true
  # add-meta-mode = none / yaml / xml - режим использования дополнительных метаданных
  #   none  - Без дополнительных данных. Только то, что pandoc генерит по дефолту.
  #   yaml  - Взять доп. данные из add-meta-yaml секции. Должна быть непуста.
  #           Подсовывается pandoc через --metadata-file.
  #   xml   - Взять доп данные из приготовленного xml-файла. Включается через --epub-metadata.
  # Для понимания что писать в файл или секцию - смотрите документацию на pandoc.
  add-meta-mode: yaml
  add-meta-xml-file: ""
  add-meta-yaml:
    subject:
      - Фантастика
      - Приключения
    description: "Краткое описание."

# ------------------------------------------------------------
# DOCX
# ------------------------------------------------------------
docx:
  # включение сборки
  enabled: true
  # Путь к reference.docx.
  # Если пусто — используется bgen/schemas/reference.docx (дефолтный).
  reference-file: ""
  # При генерации содержания в docx, нужно обновить документ после открытия,
  # чтобы содежрание отображалось (особенность docx).
  toc: true

# ------------------------------------------------------------
# TXT (plain)
# ------------------------------------------------------------
txt:
  # включение сборки
  enabled: true
  # Форматирование inline
  # inline-mode: auto / none / md / tags / gutenberg
  #                 auto        none    md              tags                  gutenberg
  # bold:           текст       текст   **текст**       [b]текст[/b]          ТЕКСТ
  # italic:         текст       текст   *текст*         [i]текст[/i]          _текст_
  # bold-italic:    текст       текст   ***текст***     [b][i]текст[/i][/b]   _ТЕКСТ_
  # strikethrough:  ~~текст~~   текст   ~~текст~~       [s]текст[/s]          ~~текст~~
  inline-mode: md
  # Ширина строки в символах (--columns).
  columns: 80
  # Перенос строк: auto / none / preserve (--wrap).
  wrap-mode: auto
  # Добавлять карточку (author, title) в начало.
  card: true
